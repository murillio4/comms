[package]
name = "voice-lib"
version = "0.1.0"
authors = ["Mitchell Hentges <mitch9654@gmail.com>"]
edition = "2018"

[dependencies]
bincode = "1.2"
mio = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
slice-deque = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
lazy_static = "1.4"
winapi = { version = "0.3", features = ["avrt", "errhandlingapi", "processthreadsapi"] }