[package]
name = "audio-device"
version = "0.1.0"
authors = ["Mitchell Hentges <mitch9654@gmail.com>"]
edition = "2021"

[dependencies]
dasp = { version = "0.11.0", features = ["interpolate", "interpolate-linear"] }
ringbuffer = "0.15"
audio_thread_priority = "0.27"
cpal = "0.15.3"
# Bounded SPSC queues keep application work off CPAL callback threads.
ringbuf = "0.4"
