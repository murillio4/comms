[package]
name = "voice-app"
version = "0.1.0"
authors = ["Mitchell Hentges <mitch9654@mozilla.com>"]
edition = "2018"

[dependencies]
async-std = "1.4"
audiopus = "0.2.0"
directories = "3.0"
futures = "0.3"
futures-timer = "3.0"
gdk-pixbuf = "0.9"
gio = "0.9"
glib = "0.10"
gtk = "0.9"
mio = { version = "0.7", features = ["tcp", "os-poll", "udp"] }
dasp = "0.11.0"
serde = "1.0"
serde_json = "1.0"
slice-deque = "0.3"

[dependencies.voice-device]
path = "../voice-device"

[dependencies.voice-lib]
path = "../voice-lib"

[target.'cfg(target_os = "windows")'.dependencies]
lazy_static = "1.4"
winapi = { version = "0.3", features = ["audioclient", "avrt", "basetsd", "coml2api", "combaseapi", "devpkey", "errhandlingapi", "ksmedia", "mmdeviceapi", "mmreg", "objbase", "synchapi", "winbase", "winnt", "wtypes"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.69"
libpulse-binding = { version = "2.13", default-features = false }
