[workspace]

members = [
    "audio-device",
    "beep-cli",
    "comms",
    "comms-lib",
    "comms-server",
    "latency-measurement",
    "live-noise-gate-ui",
    "loopback-cli",
]

[profile.release]
lto = "thin"
debug = true

[profile.dev-linux]
inherits = "dev"
split-debuginfo = "unpacked"

[profile.release-windows]
inherits = "release"
lto = true
codegen-units = 1
split-debuginfo = "packed"
