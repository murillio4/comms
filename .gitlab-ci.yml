stages:
  - build
  - build_release

build_linux:
  stage: build
  only:
    - merge_requests
  script:
    - cargo fmt --all -- --check
    - cargo clippy --locked --all-targets --all-features -- -D warnings
    - cargo build --all
    - cargo test
  tags:
    - linux

build_windows:
  stage: build
  only:
    - merge_requests
  script:
    - cargo fmt --all -- --check
    - cargo clippy --locked --all-targets --all-features -- -D warnings
    - cargo test
    - cargo build --all
  tags:
    - windows

build_release_linux:
  stage: build_release
  only:
    - main
  script:
    - cargo fmt --all -- --check
    - cargo clippy --locked --all-targets --all-features -- -D warnings
    - cargo test
    - cargo build --all --release
    - sentry-cli releases new "commit-$CI_COMMIT_SHA" --org comms --project comms-app
    - sentry-cli releases set-commits "commit-$CI_COMMIT_SHA" --auto --org comms --project comms-app
    - sentry-cli releases finalize "commit-$CI_COMMIT_SHA" --org comms --project comms-app
  artifacts:
    paths:
      - target/release/beep-cli
      - target/release/comms
      - target/release/comms-server
  tags:
    - linux

build_release_windows:
  stage: build_release
  only:
    - main
  script:
    - if (Test-Path "comms.exe") { rm "comms.exe" }
    - cargo fmt --all -- --check
    - cargo clippy --locked --all-targets --all-features -- -D warnings
    - cargo test
    - cargo build --all --profile release-windows
    - comms/package.ps1 -hide_console
    - comms/sign.ps1
    - sentry-cli upload-dif .\target\release\comms.pdb --org comms --project comms-app --include-sources
  artifacts:
    paths:
      - comms.exe
      - comms-with-console.exe
      - target/release-windows/beep-cli.exe
      - target/release-windows/comms.exe
      - target/release-windows/comms-server.exe
  tags:
    - windows
