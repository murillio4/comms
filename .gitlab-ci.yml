stages:
  - build
  - build_release

build_linux:
  stage: build
  except:
    - main
  script:
    - cargo fmt --all -- --check
    - cargo clippy --locked --all-targets --all-features -- -D warnings
    - cargo build --all
    - cargo test
  when: manual
  tags:
    - linux

build_windows:
  stage: build
  except:
    - main
  script:
    - cargo fmt --all -- --check
    - cargo clippy --locked --all-targets --all-features -- -D warnings
    - cargo test
    - cargo build --all
  when: manual
  tags:
    - windows

build_release_linux:
  stage: build_release
  only:
    - main
  script:
    - cargo fmt --all -- --check
    - cargo clippy --locked --all-targets --all-features -- -D warnings
    - cargo test
    - cargo build --all --release
  when: manual
  artifacts:
    paths:
      - target/release/beep-cli
      - target/release/comms
      - target/release/comms-server
  tags:
    - linux

build_release_windows:
  stage: build_release
  only:
    - main
  script:
    - if (Test-Path "comms.exe") { rm "comms.exe" }
    - cargo fmt --all -- --check
    - cargo clippy --locked --all-targets --all-features -- -D warnings
    - cargo test
    - cargo build --all --release
    - comms/package.ps1
    - comms/sign.ps1
  when: manual
  artifacts:
    paths:
      - comms.exe
      - target/release/beep-cli.exe
      - target/release/comms.exe
      - target/release/comms-server.exe
  tags:
    - windows
