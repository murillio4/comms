stages:
  - build
  - build_release

build_linux:
  stage: build
  except:
    - master
  script:
    - cargo build --all
    - cargo clippy --all-targets --all-features -- -D warnings
    - cargo fmt --all -- --check
    - cargo test
  tags:
    - linux

build_windows:
  stage: build
  except:
    - master
  script:
    - cargo build --all
    - cargo clippy --all-targets --all-features -- -D warnings
    - cargo fmt --all -- --check
    - cargo test
  # There's no Windows worker at the moment
  when: manual
  tags:
    - windows

build_release_linux:
  stage: build_release
  only:
    - master
  script:
    - cargo build --all --release
    - cargo clippy --all-targets --all-features -- -D warnings
    - cargo fmt --all -- --check
    - cargo test
  artifacts:
    paths:
      - target/release/beep-cli
      - target/release/voice-app
      - target/release/voice-server
  tags:
    - linux

build_release_windows:
  stage: build_release
  only:
    - master
  script:
    - cargo build --all --release
    - cargo clippy --all-targets --all-features -- -D warnings
    - cargo fmt --all -- --check
    - cargo test
  artifacts:
    paths:
      - target/release/beep-cli.exe
      - target/release/voice-app.exe
      - target/release/voice-server.exe
  # There's no Windows worker at the moment
  when: manual
  tags:
    - windows

cache:
  key:
    files:
      - Cargo.lock
    prefix: ${CI_JOB_NAME}
  paths:
    - target
