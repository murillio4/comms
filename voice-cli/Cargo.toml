[package]
name = "voice-cli"
version = "0.1.0"
authors = ["Mitchell Hentges <mitch9654@mozilla.com>"]
edition = "2018"

[dependencies]
bincode = "1.2.0"
clap = "2.33.0"
mio = "0.6.19"
ringbuf = "0.2.1"
sample = "0.10.0"
serde = { version = "1.0"}

[dependencies.voice-lib]
path = "../voice-lib"
version = "0.1.0"

[target.'cfg(target_os = "windows")'.dependencies]
lazy_static = "1.4.0"
winapi = { version = "0.3.8", features = ["audioclient", "avrt", "coml2api", "combaseapi", "devpkey", "errhandlingapi", "ksmedia", "mmdeviceapi", "objbase", "synchapi", "winbase", "winnt"] }

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = { version = "2.13.0", default-features = false }