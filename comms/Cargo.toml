[package]
name = "comms"
version = "0.1.0"
authors = ["Mitchell Hentges <mitch9654@gmail.com>"]
edition = "2021"

[dependencies]
async-channel = "1.7.1"
async-std = "1.4"
audiopus = "0.2.0"
directories = "5.0"
futures = "0.3"
futures-timer = "3.0"
include_dir = "0.7"
lewton = "0.10.2"
mio = { version = "0.8", features = ["net", "os-poll"] }
dasp = "0.11.0"
sentry = { version = "0.31", features = ["debug-images"] }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
serde_json = "1.0"

[dependencies.audio-device]
path = "../audio-device"

[dependencies.comms-lib]
path = "../comms-lib"

[dependencies.uuid]
version = "1.1.1"
features = [
    "v4",
    "fast-rng",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }
