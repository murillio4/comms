[package]
name = "comms"
version = "0.1.0"
authors = ["Mitchell Hentges <mitch9654@gmail.com>"]
edition = "2021"

[dependencies]
adw = { version = "0.3.0", package = "libadwaita", features = ["gtk_v4_4", "v1_2"] }
async-channel = "1.7.1"
async-std = "1.4"
audiopus = "0.2.0"
chrono = "0.4.22"
directories = "4.0"
futures = "0.3"
futures-timer = "3.0"
gdk-pixbuf = "0.17"
gio = "0.17"
glib = "0.17"
include_dir = "0.7"
mio = { version = "0.8", features = ["net", "os-poll"] }
dasp = "0.11.0"
sentry = { version = "0.29", features = ["debug-images"]}
serde = "1.0"
serde_json = "1.0"
sysinfo = "0.27"
ureq = { version = "2.5.0", features = ["json"]}

[dependencies.audio-device]
path = "../audio-device"

[dependencies.comms-lib]
path = "../comms-lib"

[dependencies.gtk]
package = "gtk4"
version = "0.6"
features = [
    "v4_6",
]

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.44.0"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
]

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.69"
libpulse-binding = { version = "2.13", default-features = false }

[dependencies.uuid]
version = "1.1.1"
features = [
    "v4",
    "fast-rng",
]

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
