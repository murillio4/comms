[package]
name = "comms"
version = "0.1.0"
authors = ["Mitchell Hentges <mitch9654@mozilla.com>"]
edition = "2021"

[dependencies]
async-std = "1.4"
audiopus = "0.2.0"
directories = "4.0"
futures = "0.3"
futures-timer = "3.0"
gdk-pixbuf = "0.15"
gio = "0.15"
glib = "0.15"
include_dir = "0.7"
mio = { version = "0.8", features = ["net", "os-poll"] }
dasp = "0.11.0"
sentry = { version = "0.26", features = ["backtrace", "contexts", "panic", "transport"] }
serde = "1.0"
serde_json = "1.0"
slice-deque = "0.3"

[dependencies.audio-device]
path = "../audio-device"

[dependencies.comms-lib]
path = "../comms-lib"

[dependencies.gtk]
version = "0.15"
features = [
    "v3_24",
]

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.37.0"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
]

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.69"
libpulse-binding = { version = "2.13", default-features = false }

[dependencies.uuid]
version = "1.1.1"
features = [
    "v4",
    "fast-rng",
]
